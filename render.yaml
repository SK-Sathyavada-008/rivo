services:
  - type: web
    name: rivo-app
    env: node
    plan: free
    buildCommand: "npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: "https://rivo.onrender.com"
      - key: GEMMA_API_URL
        sync: false
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_MODEL
        value: "gemma-2-9b-it"
      - key: SENTRY_DSN
        sync: false

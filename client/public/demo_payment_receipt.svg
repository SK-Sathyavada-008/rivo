<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" width="400" height="650">
  <defs>
    <linearGradient id="bgHeader" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15966A" />
      <stop offset="100%" stop-color="#18392D" />
    </linearGradient>
  </defs>

  <!-- Phone Card Background -->
  <rect width="400" height="650" rx="24" fill="#FFFFFF" stroke="#E2EBE5" stroke-width="2"/>

  <!-- Top Success Header -->
  <rect width="400" height="180" rx="24" fill="url(#bgHeader)"/>
  <rect y="160" width="400" height="20" fill="url(#bgHeader)"/>

  <!-- Success Check Icon -->
  <circle cx="200" cy="70" r="32" fill="#DDF7E9"/>
  <path d="M188 70L196 78L214 60" stroke="#15966A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Title & Amount -->
  <text x="200" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Payment Successful</text>
  <text x="200" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#DDF7E9">14 Oct 2026, 04:30 PM</text>

  <!-- Large Amount Display -->
  <text x="200" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#18392D">₹ 1,500.00</text>
  <text x="200" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#718078">Paid to Naatyavedam</text>
  <text x="200" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#718078">UPI ID: naatyavedam@upi</text>

  <!-- Divider -->
  <line x1="40" y1="300" x2="360" y2="300" stroke="#E2EBE5" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Transaction Details -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#718078">
    <text x="40" y="340">Student Name</text>
    <text x="360" y="340" text-anchor="end" font-weight="bold" fill="#26352E">Rohan Rao</text>

    <text x="40" y="380">Paid By</text>
    <text x="360" y="380" text-anchor="end" font-weight="bold" fill="#26352E">Vikram Rao</text>

    <text x="40" y="420">UPI Reference / UTR</text>
    <text x="360" y="420" text-anchor="end" font-family="monospace" font-weight="bold" fill="#26352E">428719283744</text>

    <text x="40" y="460">Bank Account</text>
    <text x="360" y="460" text-anchor="end" fill="#26352E">HDFC Bank •••• 4091</text>

    <text x="40" y="500">Remarks / Note</text>
    <text x="360" y="500" text-anchor="end" fill="#26352E">October Dance Class Fee</text>
  </g>

  <!-- Watermark: Prominent and Unmistakable -->
  <g transform="rotate(-30 200 380)">
    <rect x="10" y="345" width="380" height="50" rx="8" fill="#C24141" fill-opacity="0.15" stroke="#C24141" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="200" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#C24141" letter-spacing="2">
      DEMO — NOT A REAL PAYMENT
    </text>
  </g>

  <!-- Footer security badge -->
  <rect x="40" y="560" width="320" height="40" rx="10" fill="#F7FCF9" stroke="#E2EBE5"/>
  <text x="200" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#718078">
    🔒 Synthetic Proof for Demonstration Purposes Only
  </text>
</svg>
